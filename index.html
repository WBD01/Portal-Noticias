<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias</title>
    <link rel="stylesheet" href="styles.css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container">
        <nav id="primary" class="grid grid-flow-column">
            <div>
                <img src="assets/icons/List.svg" alt="ícone de menu">
                <strong>Menu</strong>
            </div>
            <div>
                <img src="assets/Logo.svg" alt="Logo do Portal">
            </div>
            <div>
                <strong>Buscar</strong>
                <img src="assets/icons/MagnifyingGlass.svg" alt="ícone de busca">
            </div>
        </nav>

        <nav id="secondary" class="grid grid-flow-column" >
            <a href="#">Inteligência Artificial</a>
            <a href="#">Blockchain</a>
            <a href="#">Hologramas</a>
            <a href="#">Internet</a>
            <a href="#">Vestíveis</a>
            <a href="#">Realidade Aumentada</a>
            <a href="#">Realidade Virtual</a>
        </nav>
    </header>
    <main class="grid container">
        <section id="featured" class="grid grid-flow-column gap-16">
            <figure class="card">
                <img src="assets/images/Image 01.png" alt="Imagem de destaque">
                <figcaption>
                    <span class="content-tag">Robótica</span>
                    <h2 class="text-gg">
                        Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.</h2>
                </figcaption>
            </figure>
            <div class="grid grid-flow-column2 gap-16"> 
                <figure class="card">
                    <img src="assets/images/Image 02.png" alt="Imagem de destaque">
                    <figcaption>
                    <span class="content-tag">Hologramas</span>
                    <h2 class="text-small">
                        Novo Smartphone Projetor 3D chega ao mercado, transformando a forma como vemos nossas telas! 
                    </h2>
                </figcaption>
            </figure>
                <figure class="card">
                    <img src="assets/images/Image 03.png" alt="Imagem de destaque">
                    <figcaption>
                        <span class="content-tag">Internet</span>
                        <h2 class="text-small">
                            Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comunicamos.
                        </h2>
                    </figcaption>
                </figure>
                <figure class="card">
                    <img src="assets/images/Image 04.png" alt="Imagem de destaque">
                    <figcaption>
                        <span class="content-tag">Vestíveis</span>
                        <h2 class="text-small">
                            Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o bem-estar pessoal.
                        </h2>
                        </figcaption>
                </figure>
                 <figure class="card">
                    <img src="assets/images/Image 05.png" alt="Imagem de destaque">
                    <figcaption>
                        <span class="content-tag">Realidade Virtual</span>
                        <h2 class="text-small">
                            Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradicional.
                        </h2>
                        </figcaption>
                </figure> 
            </div>
        </section>
<section id="weekly">
    <Header class="grid grid-flow-col">
        <h3>Mais lindas da semana</h3>
            <a href="#" class="grid grid-flow-col"><Strong>Ver Tudo</Strong></a>
            <span>
                
            </span>
    </Header>
    <div class="grid gap-16">
        <figure>
            <span class="content-tag">VEÍCULOS</span>
            <img src="assets/images/Image 06.png" alt="">
            <p>Protótipo de veículo voador é apresentado, marcando o início da era dos transportes aéreos pessoais.
            </p>
        </figure>

        <figure>
            <span class="content-tag">HOLOGRAMA</span>
            <img src="assets/images/Image 07.png" alt="">
            <p>Plataforma de videoconferência apresenta nova função de hologramas, tornando as chamadas virtuais mais realistas e envolventes.
            </p>
        </figure>

        <figure>
            <span class="content-tag">REALIDADE VIRTUALVeí</span>
            <img src="assets/images/Image 08.png" alt="">
            <p>Nova geração de consoles de videogame é lançada, trazendo gráficos ultra-realistas e experiências de jogo totalmente envolventes.    
            </p>
        </figure>

        <figure>
            <span class="content-tag">INTERNETs</span>
            <img src="assets/images/Image 09.png" alt="">
            <p>Projeto busca oferecer internet de alta velocidade em áreas remotas através de satélites.
            </p>
        </figure>
    </div>
</section>
    </main>
</body>
</html>
